<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="p-4 flex flex-col gap-2.5 items-center">
    <h1 class="text-3xl font-semibold text-gray-800">Posts</h1>

    <form class="flex gap-2 items-center" id="add-post-form">
      <label for="title">Title: </label>
      <input
        class="border border-gray-500 rounded-sm px-3 py-2 outline-none text-sm text-gray-700"
        type="text"
        name="title"
        id="title"
      />
      <button
        class="rounded-sm text-white text-sm font-semibold bg-blue-400 outline-none px-3 py-2 cursor-pointer"
        type="submit"
      >
        Add Post
      </button>
    </form>

    <div id="create-post-error"></div>

    <button
      class="rounded-sm text-white text-sm font-semibold bg-emerald-400 outline-none px-3 py-2 cursor-pointer"
      id="get-posts-btn"
    >
      Get Posts
    </button>
    <div class="text-gray-700 font-semibold" id="display-posts"></div>

    <script src="./js/main.js"></script>
  </body>
</html>
